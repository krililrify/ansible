---
- name: Deploy XBoard HY2 Node
  hosts: hy2
  become: true
  gather_facts: true

  tasks:

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Show Docker Compose version
      debug:
        msg: "{{ compose_version.stdout }}"

    - name: Install Git
      apt:
        name: git
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Remove old xboard-node directory
      file:
        path: /root/xboard-node
        state: absent

    - name: Clone xboard-node
      git:
        repo: "https://github.com/cedar2025/xboard-node.git"
        version: compose
        depth: 1
        dest: /root/xboard-node

    - name: Generate config.yml
      template:
        src: ../templates/config.yml.j2
        dest: /root/xboard-node/config/config.yml
        mode: "0600"

    - name: Start xboard-node
      command:
        cmd: docker compose up -d
        chdir: /root/xboard-node

    - name: Wait for container startup
      pause:
        seconds: 5

    - name: Show Docker containers
      command:
        cmd: docker compose ps
        chdir: /root/xboard-node
      register: compose_ps
      changed_when: false

    - name: Deployment result
      debug:
        msg:
          - "=========================================="
          - "       XBoard HY2 部署完成"
          - "=========================================="
          - "Panel URL : {{ panel_url }}"
          - "Node ID   : {{ node_id }}"
          - "Domain    : {{ domain }}"
          - ""
          - "{{ compose_ps.stdout }}"
